[project]
name = "rag-lib"
version = "0.1.3"
description = "Advanced RAG Library for Ingestion, Segmentation, and Indexing"
authors = [
    { name = "User", email = "user@example.com" }
]
dependencies = [
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "tabulate>=0.9.0",
    "numpy>=1.20.0",
    "nltk>=3.9.0",
    "rapidfuzz>=3.13.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "langchain-chroma>=0.1.0",
    "langchain-qdrant>=0.1.0",
    "langchain-postgres>=0.0.1",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "qdrant-client>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "yandex-chain>=0.0.1", 
    "mistralai>=0.1.0",
    "networkx>=3.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]
miner_u = [
    "magic-pdf>=0.6.0"
]
graph = [
    "neo4j>=5.15.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
python_files = "test_*.py"
