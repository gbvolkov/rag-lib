[project]
name = "rag-lib"
version = "0.2.7"
description = "Advanced RAG Library for Ingestion, Segmentation, and Indexing"
authors = [
    { name = "User", email = "user@example.com" }
]
dependencies = [
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
    "tabulate>=0.9.0",
    "numpy>=1.20.0",
    "nltk>=3.9.0",
    "langdetect>=1.0.9",
    "rapidfuzz>=3.13.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "langchain-chroma>=0.1.0",
    "langchain-qdrant>=0.1.0",
    "langchain-postgres>=0.0.1",
    "sentence-transformers>=2.2.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "qdrant-client>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.32.0",
    "yandex-chain>=0.0.1",
    "mistralai>=0.1.0",
    "networkx>=3.0",
    "pip>=26.0.1",
    "pypdf>=6.7.0",
    "pymupdf>=1.27.1",
    "pymupdf4llm>=0.3.4",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "rank-bm25>=0.2.2",
    "playwright>=1.58.0",
    "pandas>=2.3.3",
]
requires-python = ">=3.12,<3.14"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]
miner_u = [
    "mineru[all]"
]
graph = [
    "neo4j>=5.15.0"
]
raptor = [
    "umap-learn>=0.5.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "pandas>=2.0.0"
]
pymupdf = [
    "pymupdf>=1.24.0",
    "pymupdf4llm>=0.0.17"
]
web = [
    "playwright>=1.51.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_default_fixture_loop_scope = "function"
